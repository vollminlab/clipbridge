name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  shell:
    name: shell (shellcheck, dash, busybox ash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # dash and shellcheck ship preinstalled on the ubuntu-latest runner image;
      # busybox-static is not, and its ash applet is what we need for the
      # busybox suite run (regular busybox package can lack the ash applet
      # depending on build).
      - name: Install busybox-static
        run: sudo apt-get update && sudo apt-get install -y busybox-static

      # -s sh: clipbridge-recv has no .sh extension, so shellcheck can't infer
      # the dialect from the filename. All four files use #!/bin/sh anyway, so
      # -s sh is correct for all of them, not just the extensionless one.
      - name: shellcheck
        run: |
          shellcheck -s sh \
            linux/clipbridge-recv \
            linux/clipbridge-recv_test.sh \
            linux/install.sh \
            linux/install_test.sh

      - name: dash - clipbridge-recv_test.sh
        run: dash linux/clipbridge-recv_test.sh

      - name: dash - install_test.sh
        run: dash linux/install_test.sh

      - name: busybox ash - clipbridge-recv_test.sh
        run: busybox ash linux/clipbridge-recv_test.sh

      - name: busybox ash - install_test.sh
        run: busybox ash linux/install_test.sh

  pester:
    name: pester (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Production runs powershell.exe -STA (Windows PowerShell 5.1). Testing
      # so far has only ever exercised pwsh (7) on Linux. Run the suite under
      # BOTH runtimes here so a 5.1-only regression (e.g. the $IsWindows gap
      # already hit once) can't slip through unnoticed.
      - name: Pester on pwsh (PowerShell 7)
        shell: pwsh
        run: |
          Install-Module Pester -Force -SkipPublisherCheck -MinimumVersion 5.5.0
          Import-Module Pester -MinimumVersion 5.5.0
          $result = Invoke-Pester -Path windows/tests -PassThru
          "Total={0} Passed={1} Failed={2} Skipped={3}" -f $result.TotalCount, $result.PassedCount, $result.FailedCount, $result.SkippedCount
          if ($result.FailedCount -gt 0 -or $result.SkippedCount -gt 0) {
            Write-Error "pwsh run: $($result.FailedCount) failed, $($result.SkippedCount) skipped (want 0 and 0)"
            exit 1
          }

      - name: Pester on powershell (Windows PowerShell 5.1)
        shell: powershell
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-Module Pester -Force -SkipPublisherCheck -MinimumVersion 5.5.0
          Import-Module Pester -MinimumVersion 5.5.0
          $result = Invoke-Pester -Path windows/tests -PassThru
          "Total={0} Passed={1} Failed={2} Skipped={3}" -f $result.TotalCount, $result.PassedCount, $result.FailedCount, $result.SkippedCount
          if ($result.FailedCount -gt 0 -or $result.SkippedCount -gt 0) {
            Write-Error "powershell 5.1 run: $($result.FailedCount) failed, $($result.SkippedCount) skipped (want 0 and 0)"
            exit 1
          }

  dotnet-core:
    name: dotnet-core (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test ClipBridge.Core (portable, no Windows APIs)
        working-directory: dotnet
        run: dotnet test ClipBridge.Core.Tests/ClipBridge.Core.Tests.csproj --logger "console;verbosity=normal"

      # Release specifically, not just Debug: ImageSharp 4.x ships a build-time
      # licence gate that is a hard ERROR in Release and only a warning in Debug,
      # so a Debug-only check would let an accidental unpin through and break
      # publish. Also proves the trim/AOT analyzer stays quiet.
      - name: Build Release + AOT analyzer
        working-directory: dotnet
        run: |
          dotnet build -c Release
          dotnet build ClipBridge.Core/ClipBridge.Core.csproj -c Release -p:IsAotCompatible=true

  dotnet-win32:
    name: dotnet-win32 (windows, AOT publish)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The only place the P/Invokes are genuinely exercised. A green
      # `dotnet test` on Linux for a net10.0-windows project proves the code
      # compiled and the harness did not crash - it does not call user32.dll.
      - name: Test ClipBridge.Win32 (real Win32 calls)
        working-directory: dotnet
        run: dotnet test ClipBridge.Win32.Tests/ClipBridge.Win32.Tests.csproj --logger "console;verbosity=normal"

      # NativeAOT cannot cross-compile: publishing win-x64 from Linux fails with
      # "Cross-OS native compilation is not supported", so this job is the only
      # place the AOT toolchain runs at all. The flags are passed on the command
      # line rather than set in the csproj on purpose - Task 21 moves them into
      # ClipBridge.App.csproj properly. Running the produced binary is the point:
      # AOT + P/Invoke + ImageSharp is the least-travelled combination in this
      # design, and a publish that links is not the same as a binary that runs.
      - name: AOT publish smoke test
        working-directory: dotnet
        run: |
          # No -r/--self-contained/-p:PublishAot flags: they now live in
          # ClipBridge.App.csproj (Task 21), so a bare publish is also the check
          # that the csproj really carries them.
          dotnet publish ClipBridge.App/ClipBridge.App.csproj -c Release
          $exe = ".\ClipBridge.App\bin\Release\net10.0-windows\win-x64\publish\ClipBridge.App.exe"

          # clipbridge is RESIDENT - tray icon plus a message pump - so a correct
          # binary never exits on its own. Running it bare (which worked while
          # Program.cs was still hello-world) would hang the job forever, and simply
          # skipping the run would give up the only automated exercise this startup
          # path ever gets. So: start it, let it get through RegisterClassW /
          # CreateWindowExW / SetWindowsHookExW / Shell_NotifyIconW, and assert it is
          # STILL ALIVE. An early exit means a startup failure.
          #
          # This is not hypothetical: it is exactly how CreateWindowExW's missing
          # CharSet.Unicode was caught (ERROR_CANNOT_FIND_WND_CLASS, 1407). None of
          # this code runs anywhere else - not on Linux, not in any unit test.
          $p = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput aot-out.txt -RedirectStandardError aot-err.txt
          Start-Sleep -Seconds 15
          if ($p.HasExited) {
            Write-Host "--- stdout ---"; Get-Content aot-out.txt -ErrorAction SilentlyContinue
            Write-Host "--- stderr ---"; Get-Content aot-err.txt -ErrorAction SilentlyContinue
            Write-Error "ClipBridge.App.exe exited early with code $($p.ExitCode); a resident app should still be running"
            exit 1
          }
          Write-Host "AOT binary still resident after 15s - startup path OK"
          Stop-Process -Id $p.Id -Force

          # --install exits on its own, so it can be run directly. This is the only
          # automated exercise InstallCommand.ProbeTransport ever gets: it spawns a
          # real ssh.exe on a real Windows host, which is precisely the shape that
          # deadlocked when stdout/stderr were drained sequentially. It is EXPECTED
          # to fail here - the runner cannot reach devsbx01 - so the assertion is
          # that it fails *gracefully*: a handled non-zero exit with a diagnostic,
          # never an unhandled exception and never a hang.
          $out = & $exe --install 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host "--install exit=$code"
          Write-Host $out
          if ($out -match "Unhandled exception") {
            Write-Error "--install crashed instead of reporting a transport failure"
            exit 1
          }
          if ($code -ne 0 -and $code -ne 1) {
            Write-Error "--install exited $code; expected 0 (installed) or 1 (handled probe failure)"
            exit 1
          }
          Write-Host "--install terminated cleanly with a handled exit code"

          # Explicit exit 0: GitHub's pwsh wrapper ends the step with an implicit
          # `exit $LASTEXITCODE`, and --install's deliberate exit 1 is still sitting
          # in that variable at this point. Without this the step fails on a value
          # the assertions above already inspected and accepted.
          exit 0

      # Without this the binary is built on an ephemeral runner and destroyed with
      # it - there is no other way to get clipbridge.exe onto the laptop, because
      # NativeAOT cannot cross-compile from Linux (measured: "Cross-OS native
      # compilation is not supported"). Uploaded from every run, not just main, so
      # a PR build can be tested before it merges.
      - name: Upload clipbridge.exe
        uses: actions/upload-artifact@v4
        with:
          name: clipbridge-win-x64
          path: dotnet/ClipBridge.App/bin/Release/net10.0-windows/win-x64/publish/
          if-no-files-found: error
          retention-days: 90
